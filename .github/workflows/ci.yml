name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with: { enable-cache: true }
      - run: uv sync
      - run: uv run ruff check src/ scripts/ tests/
      - run: uv run pytest tests/ --cov=quadruped_rl --cov-report=term

# LLM-guided reward coach (llm_feedback/coach.py). Composed after reward/*.
# Outer loop: every interval_steps (aligned to run.eval_interval_steps) the
# coach reads KPIs + component contributions + gait descriptors and proposes
# bounded parameter changes; rollback restores policy+params if J drops.
coach:
  strategy: llm                     # llm | random | hillclimb | none
  interval_steps: 2_000_000         # must be a multiple of run.eval_interval_steps
  warmup_steps: 2_000_000           # first intervention after this many steps
  max_params: 3                     # per intervention
  max_rel_change: 0.3               # linear params: +-30% of |current| (or of range if 0)
  max_log_factor: 3.0               # log-scale params: x/÷3 per intervention
  rollback_tolerance: 0.05          # J drop beyond this -> rollback
  noise_window: 10                  # evals used to estimate the evaluation noise of J
  noise_z: 2.0                      # effective tolerance = max(rollback_tolerance, noise_z*sqrt(2)*sigma)
  tolerance_max: 0.3                # cap of the effective tolerance
  best_confirm: 2                   # "best" = highest mean of this many consecutive evals
  max_restores_per_snapshot: 1      # a best snapshot is restored at most this often
  cooldown_after_rollback: 1        # skip this many intervention slots after a rollback
  objective:                        # J = sum w_m * KPI_m  (deterministic eval)
    success_rate: 1.0               # falls are not a term: early-training fall
    mean_forward_velocity_ms: 0.5   # counts swing by +-10/min and would trigger
                                    # spurious rollbacks; they already lower both
  eval_note: "first episode of 256 fixed envs, 5 m course, 20 s limit"
  kpi_command:                      # KPI -> parameter that commands it (report
    mean_forward_velocity_ms: forward_velocity.target_ms   # states the ceiling)
  tracking_ratio: 0.75              # measured/commanded above this = "tracks its command"
  # ---- coach v5 decision layer (shared by llm/random/hillclimb; docs/coach_versions.md)
  confirm_evals: 1                  # re-evaluations when a drop is ambiguous (sequential test)
  confirm_zone: 0.5                 # ambiguous = drop in (confirm_zone*tol, tol]
  trend_points: 4                   # evals used for the pre-intervention linear trend
  curriculum_params: [forward_velocity.target_ms]   # levers under the release invariant
  release_from_progress: 0.5        # invariant active after this fraction of the budget
  release_min_success: 0.3          # ... and only while success_rate >= this (2 reports)
  phases: { exploit: 0.5, consolidate: 0.85 }       # fractions of the budget
  effect_prior_sd: 0.1              # N(0, sd) prior of a move's effect on J
  # effect_prior: { forward_velocity.target_ms: { up: [0.03, 0.05] } }  # optional, per (param, dir)
  tracking_ratio_prior: 0.89        # measured/commanded speed, batches 3-4 (462 reports)
  forecast_min_points: 4            # evals of a lineage before the curve fit is shown
  llm:
    provider: openai
    model: gpt-5.4-2026-03-05
    reasoning_effort: high
    max_tokens: 16000                # reasoning tokens count against this; 4000 was
    retries: 1                       # exhausted by reasoning in ~4 % of calls
  # Tunable subset of reward parameters. Bounds never straddle zero (sign lock).
  # The task is defined by the objective J (fixed eval), not by the reward, so
  # the commanded speed is tunable as a curriculum lever (2026-09-05: 2/5
  # rough-hard seeds never left the standing optimum — no gradient at v~0).
  params:
    forward_velocity.target_ms: { low: 0.3, high: 1.5,
                               description: "commanded speed tracked by exp(-4 (v_x - target)^2); also an observation" }
    energy.weight:           { low: -5.0e-3, high: -1.0e-6, scale: log,
                               description: "-(sum tau^2); walking sum tau^2 ~ 2000" }
    stability.weight:        { low: -3.0, high: -0.05,
                               description: "-(roll^2 + pitch^2)" }
    foot_slip.weight:        { low: -1.0, high: -0.01,
                               description: "-(sum tangential foot speed^2 while in contact)" }
    joint_limit.weight:      { low: -1.0, high: -0.02,
                               description: "-(soft joint limit violation)" }
    action_rate.weight:      { low: -0.1, high: -0.001, scale: log,
                               description: "-(sum (a_t - a_{t-1})^2)" }
    feet_air_time.weight:    { low: 0.0, high: 3.0,
                               description: "+sum (air_time - target_s) at touchdown; gait prior" }
    feet_air_time.target_s:  { low: 0.2, high: 0.8,
                               description: "desired swing duration [s]" }
    lateral_velocity.weight: { low: -3.0, high: -0.05, description: "-(v_y^2)" }
    yaw_rate.weight:         { low: -2.0, high: -0.05, description: "-(yaw_rate^2)" }
    alive_bonus.weight:      { low: 0.0, high: 0.5, description: "+1 per step alive" }
    termination.weight:      { low: -30.0, high: -1.0, description: "one-off fall penalty" }
    # live PPO hyperparameters (algorithms/ppo.py::set_hyperparams)
    algo.learning_rate:      { low: 3.0e-5, high: 1.0e-3, scale: log,
                               description: "Adam step size (default 3e-4)" }
    algo.entropy_coef:       { low: 1.0e-4, high: 0.05, scale: log,
                               description: "entropy bonus; raises/keeps exploration noise (default 5e-3)" }
  component_docs:
    forward_velocity: "exp(-4 (v_x - target_ms)^2); ~0.02 at v=0 for target 1.0, i.e. no gradient far from target"
    energy: "sum of squared joint torques"
    stability: "roll^2 + pitch^2 of the base"
    foot_slip: "squared tangential foot velocity while in contact"
    joint_limit: "soft joint-limit violation"
    action_rate: "squared change of action between steps"
    feet_air_time: "(swing duration - target_s) summed at touchdown, only when commanded to move"
    lateral_velocity: "v_y^2"
    yaw_rate: "yaw_rate^2"
    alive_bonus: "1 per step while not fallen"
    termination: "1 on the fall step"

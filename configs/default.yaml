# Base config. Composition order (later overrides earlier):
#   default <- algorithm/* <- robot/* <- terrain/* <- reward/* <- experiment/* <- CLI
run:
  seed: 0
  device: cuda
  total_timesteps: 100_000_000
  eval_interval_steps: 1_000_000
  eval_episodes: 20
  checkpoint_interval_steps: 5_000_000
  smoke_test: false            # if true: tiny env count / few steps, CPU-safe

sim:
  backend: isaacgym            # isaacgym | pybullet | gazebo
  num_envs: 4096
  dt: 0.005                    # physics step (200 Hz)
  control_decimation: 4        # policy at 50 Hz
  episode_length_s: 20.0

logging:
  wandb: true
  project: quadruped-rl-thesis
  log_interval_steps: 100_000
  save_resolved_config: true   # mandatory for reproducibility

curriculum:
  enabled: true
  levels: [easy, medium, hard]
  promote_success_rate: 0.8    # advance difficulty when success rate exceeds this
  window_episodes: 100

robot:
  name: a1
  urdf: assets/robots/a1/a1.urdf
  mass_kg: 12.0
  num_joints: 12
  default_joint_pos: [0.0, 0.9, -1.8,  0.0, 0.9, -1.8,  0.0, 0.9, -1.8,  0.0, 0.9, -1.8]
  torque_limit_nm: 33.5
  control: { type: position, stiffness: 28.0, damping: 0.7 }
  sensors:
    proprioceptive: { joint_pos: true, joint_vel: true, joint_torque: true, imu: true, rate_hz: 1000 }
    exteroceptive: { foot_contact_force: true, depth_camera: true, lidar: false }

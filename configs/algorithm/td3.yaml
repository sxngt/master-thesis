algorithm:
  name: td3
  type: off_policy
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  policy_delay: 2              # delayed policy update (2:1)
  target_noise: 0.2            # target policy smoothing
  noise_clip: 0.5
  exploration_noise: 0.1
  clipped_double_q: true
  buffer_size: 1_000_000
  batch_size: 4096
  warmup_steps: 10_000
  network:
    actor: { hidden: [512, 256, 128], activation: relu }
    critic: { hidden: [512, 512, 256, 128], activation: relu }
search_space:
  learning_rate: { low: 1.0e-5, high: 1.0e-3, log: true }
  target_noise: { low: 0.1, high: 0.5 }
  policy_delay: { choices: [1, 2, 3] }

algorithm:
  name: sac
  type: off_policy
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  auto_temperature: true       # automatic entropy temperature tuning
  target_entropy: auto         # -dim(A) if auto
  init_temperature: 0.2
  double_q: true               # twin Q-networks against overestimation
  buffer_size: 1_000_000
  batch_size: 4096
  warmup_steps: 10_000
  steps_per_iteration: 256
  updates_per_step: 1
  network:
    actor: { hidden: [512, 256, 128], activation: relu }
    critic: { hidden: [512, 512, 256, 128], activation: relu }
search_space:
  learning_rate: { low: 1.0e-5, high: 1.0e-3, log: true }
  tau: { low: 0.001, high: 0.02, log: true }
  batch_size: { choices: [1024, 2048, 4096, 8192] }

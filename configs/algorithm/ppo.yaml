algorithm:
  name: ppo
  type: on_policy
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95             # dynamically adjusted by terrain complexity (see envs/curriculum.py)
  clip_range: 0.2
  adaptive_kl: { enabled: true, target_kl: 0.01, penalty_init: 1.0 }
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 1.0
  rollout_steps: 24            # per env per update
  num_epochs: 5
  num_minibatches: 4
  network:
    actor: { hidden: [512, 256, 128], activation: elu, recurrent: false }
    critic: { hidden: [512, 512, 256, 128], activation: elu }
search_space:                  # Optuna Bayesian optimization ranges
  learning_rate: { low: 1.0e-5, high: 1.0e-3, log: true }
  clip_range: { low: 0.1, high: 0.3 }
  entropy_coef: { low: 0.001, high: 0.1, log: true }
  gae_lambda: { low: 0.9, high: 0.99 }
